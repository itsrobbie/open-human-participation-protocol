services:
  # profile); rebuilt frequently. Assumes the backing tier is already running.
  resolver:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: platform/resolver/Dockerfile
    ports:
      - "${OHPP_PORT_RESOLVER_HTTP:-5050}:8080"    # HTTP (kept as fallback during the HTTPS migration)
      - "${OHPP_PORT_RESOLVER_HTTPS:-5443}:8443"    # HTTPS (TLS with the step-ca leaf cert)
    volumes:
      - ca_certs:/certs:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__PostgreSQL: "Host=postgres;Database=${OHPP_DB_NAME:-ohpp};Username=ohpp;Password=${POSTGRES_PASSWORD:-ohpp_dev_password};SSL Mode=VerifyFull;Root Certificate=/certs/root_ca.crt"
      Resolver__BaseUrl: "http://localhost:${OHPP_PORT_RESOLVER_HTTP:-5050}"
      Resolver__InternalBaseUrl: "http://resolver:8080"
      Resolver__Name: "OHPP Demo Resolver"
      Resolver__EncryptionKey: ${RESOLVER_ENCRYPTION_KEY:-dev-encryption-key-min-32-chars!!}
      # Registration rate limit per user per rolling hour. Production/dev default
      # is 10. The E2E suite resets the DB only once and never restarts the
      # resolver mid-run, so the single demo user accumulates a whole suite's
      # worth of registrations in minutes - global-setup raises this so the
      # connect-heavy specs (bank/insurance/pizza/marketplace + the device/CLI
      # specs) are not rate-limited by each other. Default keeps prod behaviour.
      Resolver__MaxRegistrationsPerHour: ${OHPP_MAX_REGISTRATIONS_PER_HOUR:-10}
      Auth__Provider: "Keycloak"
      # Internal JWKS/metadata fetch over HTTPS (U7.1). Browser-issued tokens carry
      # the localhost issuer; the validator accepts both (see KeycloakIdentityTokenValidator).
      Auth__Keycloak__Authority: "https://keycloak:8443/realms/ohpp"
      Features__ProtocolLab: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "ohpp.resolver"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${OHPP_DEPLOYMENT_ENV:-stack-0},service.instance.id=${OHPP_OTEL_INSTANCE_ID:-0}"
      # TLS (U7.1): serve HTTPS on 8443 with the resolver leaf cert (chain) in
      # addition to HTTP on 8080. Trust the dev root for outbound TLS calls.
      OHPP_TLS_CERT_PATH: /certs/resolver.chain.crt
      OHPP_TLS_KEY_PATH: /certs/resolver.key
      OHPP_TLS_PORT: "8443"
      SSL_CERT_FILE: /certs/root_ca.crt
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ohpp-app
      - ohpp-shared

  portal:
    profiles: ["apps"]
    build:
      context: platform/portal
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_PROTOCOL_LAB: "true"
        # Browser exports OTLP/HTTP to the Collector's host-published port.
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:${OHPP_PORT_OTLP_HTTP:-4318}"
        VITE_OTEL_SERVICE_NAME: "ohpp.portal"
    ports:
      - "${OHPP_PORT_PORTAL:-3000}:80"
    volumes:
      - ca_certs:/certs:ro
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      - ohpp-app
      - ohpp-shared

  # --- Landing page: the single front door to the whole demo ---
  # Self-contained static site (no backend/DB/auth). It only links out to the
  # other services, so it has no depends_on and starts instantly. This is the one
  # URL `make dev` prints; it maps everything else, grouped by purpose.
  landing:
    profiles: ["apps"]
    build:
      context: platform/landing
      dockerfile: Dockerfile
    ports:
      - "${OHPP_PORT_LANDING:-8888}:80"
    healthcheck:
      # Use 127.0.0.1 (not localhost): nginx listens on IPv4, but localhost can
      # resolve to IPv6 ::1 first inside the container, giving a false refusal.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ohpp-app
      - ohpp-shared

  # --- Demo apps ---
  bank:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: demo/mock-apps/dotnet/bank/Dockerfile
    ports:
      - "${OHPP_PORT_BANK:-5010}:5010"
    volumes:
      - ca_certs:/certs:ro
    environment:
      Bank__AppId: "bank.demo.test"
      Bank__BaseUrl: "http://localhost:${OHPP_PORT_BANK:-5010}"
      Bank__ResolverInternalUrl: "https://resolver:8443"
      WorldDatabase__ConnectionString: "Host=postgres;Port=5432;Database=${OHPP_DB_NAME:-ohpp};Username=bank_app;Password=ohpp_bank_demo_password;SSL Mode=VerifyFull;Root Certificate=/certs/root_ca.crt"
      WorldDatabase__RunBootstrap: "true"
      Auth__Keycloak__Authority: "https://keycloak:8443/realms/ohpp-bank"
      Auth__Keycloak__Audience: "ohpp-bank-app"
      Auth__PublicAuthority: "http://localhost:8080/realms/ohpp-bank"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "ohpp.bank"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${OHPP_DEPLOYMENT_ENV:-stack-0},service.instance.id=${OHPP_OTEL_INSTANCE_ID:-0}"
      # Trust the dev CA root for the outbound TLS call to the resolver.
      SSL_CERT_FILE: /certs/root_ca.crt
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      - ohpp-app
      - ohpp-shared

  insurance-claims:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: demo/mock-apps/dotnet/insurance-claims/Dockerfile
    ports:
      - "${OHPP_PORT_INSURANCE:-5020}:5020"
    volumes:
      - ca_certs:/certs:ro
    environment:
      Insurance__AppId: "insurance-claims.demo.test"
      Insurance__BaseUrl: "http://localhost:${OHPP_PORT_INSURANCE:-5020}"
      Insurance__ResolverUrl: "https://resolver:8443"
      WorldDatabase__ConnectionString: "Host=postgres;Port=5432;Database=${OHPP_DB_NAME:-ohpp};Username=insurance_claims_app;Password=ohpp_insurance_demo_password;SSL Mode=VerifyFull;Root Certificate=/certs/root_ca.crt"
      WorldDatabase__RunBootstrap: "true"
      Auth__Keycloak__Authority: "https://keycloak:8443/realms/ohpp-insurance"
      Auth__Keycloak__Audience: "ohpp-insurance-app"
      Auth__PublicAuthority: "http://localhost:8080/realms/ohpp-insurance"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "ohpp.insurance"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${OHPP_DEPLOYMENT_ENV:-stack-0},service.instance.id=${OHPP_OTEL_INSTANCE_ID:-0}"
      SSL_CERT_FILE: /certs/root_ca.crt
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      - ohpp-app
      - ohpp-shared

  pizza:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: demo/mock-apps/node/pizza/Dockerfile
    ports:
      - "${OHPP_PORT_PIZZA:-5030}:5030"
    volumes:
      - ca_certs:/certs:ro
    environment:
      PORT: "5030"
      PIZZA_APP_ID: "pizza.demo.test"
      PIZZA_BASE_URL: "http://localhost:${OHPP_PORT_PIZZA:-5030}"
      PIZZA_RESOLVER_URL: "https://resolver:8443"
      WORLD_DATABASE_CONNECTION_STRING: "postgresql://pizza_app:ohpp_pizza_demo_password@postgres:5432/${OHPP_DB_NAME:-ohpp}?sslmode=verify-full"
      WORLD_DATABASE_RUN_BOOTSTRAP: "true"
      AUTH_KEYCLOAK_AUTHORITY: "https://keycloak:8443/realms/ohpp-pizza"
      AUTH_KEYCLOAK_AUDIENCE: "ohpp-pizza-app"
      AUTH_PUBLIC_AUTHORITY: "http://localhost:8080/realms/ohpp-pizza"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_SERVICE_NAME: "ohpp.pizza"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${OHPP_DEPLOYMENT_ENV:-stack-0},service.instance.id=${OHPP_OTEL_INSTANCE_ID:-0}"
      # Trust the dev CA root for the outbound TLS call to the resolver (Node).
      NODE_EXTRA_CA_CERTS: /certs/root_ca.crt
    depends_on:
      resolver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5030/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ohpp-app
      - ohpp-shared

  marketplace:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: demo/mock-apps/node/marketplace/Dockerfile
    ports:
      - "${OHPP_PORT_MARKETPLACE:-5040}:5040"
    volumes:
      - ca_certs:/certs:ro
    environment:
      PORT: "5040"
      MARKETPLACE_APP_ID: "marketplace.demo.test"
      MARKETPLACE_BASE_URL: "http://localhost:${OHPP_PORT_MARKETPLACE:-5040}"
      MARKETPLACE_RESOLVER_URL: "https://resolver:8443"
      WORLD_DATABASE_CONNECTION_STRING: "postgresql://marketplace_app:ohpp_marketplace_demo_password@postgres:5432/${OHPP_DB_NAME:-ohpp}?sslmode=verify-full"
      WORLD_DATABASE_RUN_BOOTSTRAP: "true"
      AUTH_KEYCLOAK_AUTHORITY: "https://keycloak:8443/realms/ohpp-marketplace"
      AUTH_KEYCLOAK_AUDIENCE: "ohpp-marketplace-app"
      AUTH_PUBLIC_AUTHORITY: "http://localhost:8080/realms/ohpp-marketplace"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_SERVICE_NAME: "ohpp.marketplace"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${OHPP_DEPLOYMENT_ENV:-stack-0},service.instance.id=${OHPP_OTEL_INSTANCE_ID:-0}"
      NODE_EXTRA_CA_CERTS: /certs/root_ca.crt
    depends_on:
      resolver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5040/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ohpp-app
      - ohpp-shared

  # --- CLI (interactive) ---
  cli:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: demo/client-cli/Dockerfile
    stdin_open: true
    tty: true
    volumes:
      - cli_config:/root/.ohpp
      - ca_certs:/certs:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "ohpp.cli"
      # Trust the dev CA root for the outbound TLS OTLP export (.NET/OpenSSL).
      SSL_CERT_FILE: /certs/root_ca.crt
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      - ohpp-app
      - ohpp-shared

  # --- Analytics (opt-in `analytics` profile: `make dev-analytics`) ---
  # Product analytics via Umami (events, funnels, retention, journeys). Umami
  # replaced PostHog: current PostHog self-host needs Kafka + ~16GB RAM and can't
  # cleanly reuse shared datastores, which breaks this unit's lean one-command
  # goal. Umami is Postgres-ONLY (no ClickHouse/Redis/Kafka) and reuses the shared
  # World Postgres via its own `umami` db. See deployment-architecture.md.
  #
  # One-shot: Umami auto-migrates on boot, so this seeds a fixed dev website
  # (deterministic UUID) via the authenticated API once Umami is healthy, so the

volumes:
  cli_config:
  ca_certs:
    name: ohpp-ca-certs
    external: true

networks:
  ohpp-app:
    driver: bridge
  ohpp-shared:
    name: ohpp-shared
    external: true
