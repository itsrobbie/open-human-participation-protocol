# Isolated test stack — used by E2E tests only.
# Different ports so it doesn't conflict with the dev stack.
# Spun up by global-setup.ts, torn down by global-teardown.ts.

services:
  # --- Backing services ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ohpp
      POSTGRES_PASSWORD: ohpp_test_password
      POSTGRES_DB: ohpp
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohpp"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - ohpp-test

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./platform/resolver/keycloak/realm-export.json:/opt/keycloak/data/import/ohpp-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ohpp-test

  # --- Platform ---
  resolver:
    build:
      context: .
      dockerfile: platform/resolver/Dockerfile
    ports:
      - "5150:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__PostgreSQL: "Host=postgres;Database=ohpp;Username=ohpp;Password=ohpp_test_password"
      Resolver__BaseUrl: "http://localhost:5150"
      Resolver__Name: "OHPP Test Resolver"
      Resolver__EncryptionKey: "test-encryption-key-min-32-chars!!"
      Auth__Provider: "Keycloak"
      Auth__Keycloak__Authority: "http://keycloak:8080/realms/ohpp"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - ohpp-test

  portal:
    build:
      context: platform/portal
      dockerfile: Dockerfile
    ports:
      - "3100:80"
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      - ohpp-test

  # --- Demo apps ---
  bank:
    build:
      context: .
      dockerfile: demo/mock-apps/dotnet/bank/Dockerfile
    ports:
      - "5110:5010"
    environment:
      Bank__AppId: "bank.demo.test"
      Bank__BaseUrl: "http://localhost:5110"
      Bank__ResolverInternalUrl: "http://resolver:8080"
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      - ohpp-test

networks:
  ohpp-test:
    driver: bridge
