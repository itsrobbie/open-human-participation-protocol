services:
  # --- Backing services ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ohpp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ohpp_dev_password}
      POSTGRES_DB: ohpp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform/world-database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohpp"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ohpp

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./platform/resolver/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - ohpp

  # --- Platform ---
  resolver:
    build:
      context: .
      dockerfile: platform/resolver/Dockerfile
    ports:
      - "5050:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__PostgreSQL: "Host=postgres;Database=ohpp;Username=ohpp;Password=${POSTGRES_PASSWORD:-ohpp_dev_password}"
      Resolver__BaseUrl: "http://localhost:5050"
      Resolver__InternalBaseUrl: "http://resolver:8080"
      Resolver__Name: "OHPP Demo Resolver"
      Resolver__EncryptionKey: ${RESOLVER_ENCRYPTION_KEY:-dev-encryption-key-min-32-chars!!}
      Auth__Provider: "Keycloak"
      Auth__Keycloak__Authority: "http://keycloak:8080/realms/ohpp"
      Features__ProtocolLab: "true"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ohpp

  portal:
    build:
      context: platform/portal
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_PROTOCOL_LAB: "true"
    ports:
      - "3000:80"
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      - ohpp

  # --- Demo apps ---
  bank:
    build:
      context: .
      dockerfile: demo/mock-apps/dotnet/bank/Dockerfile
    ports:
      - "5010:5010"
    environment:
      Bank__AppId: "bank.demo.test"
      Bank__BaseUrl: "http://localhost:5010"
      Bank__ResolverInternalUrl: "http://resolver:8080"
      WorldDatabase__ConnectionString: "Host=postgres;Port=5432;Database=ohpp;Username=bank_app;Password=ohpp_bank_demo_password"
      WorldDatabase__RunBootstrap: "true"
      Auth__Keycloak__Authority: "http://keycloak:8080/realms/ohpp-bank"
      Auth__Keycloak__Audience: "ohpp-bank-app"
      Auth__PublicAuthority: "http://localhost:8080/realms/ohpp-bank"
    depends_on:
      resolver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ohpp

  insurance-claims:
    build:
      context: .
      dockerfile: demo/mock-apps/dotnet/insurance-claims/Dockerfile
    ports:
      - "5020:5020"
    environment:
      Insurance__AppId: "insurance-claims.demo.test"
      Insurance__BaseUrl: "http://localhost:5020"
      Insurance__ResolverUrl: "http://resolver:8080"
      WorldDatabase__ConnectionString: "Host=postgres;Port=5432;Database=ohpp;Username=insurance_claims_app;Password=ohpp_insurance_demo_password"
      WorldDatabase__RunBootstrap: "true"
      Auth__Keycloak__Authority: "http://keycloak:8080/realms/ohpp-insurance"
      Auth__Keycloak__Audience: "ohpp-insurance-app"
      Auth__PublicAuthority: "http://localhost:8080/realms/ohpp-insurance"
    depends_on:
      resolver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ohpp

  pizza:
    build:
      context: .
      dockerfile: demo/mock-apps/node/pizza/Dockerfile
    ports:
      - "5030:5030"
    environment:
      PORT: "5030"
      PIZZA_APP_ID: "pizza.demo.test"
      PIZZA_BASE_URL: "http://localhost:5030"
      PIZZA_RESOLVER_URL: "http://resolver:8080"
      WORLD_DATABASE_CONNECTION_STRING: "postgresql://pizza_app:ohpp_pizza_demo_password@postgres:5432/ohpp"
      WORLD_DATABASE_RUN_BOOTSTRAP: "true"
      AUTH_KEYCLOAK_AUTHORITY: "http://keycloak:8080/realms/ohpp-pizza"
      AUTH_KEYCLOAK_AUDIENCE: "ohpp-pizza-app"
      AUTH_PUBLIC_AUTHORITY: "http://localhost:8080/realms/ohpp-pizza"
    depends_on:
      resolver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5030/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ohpp

  marketplace:
    build:
      context: .
      dockerfile: demo/mock-apps/node/marketplace/Dockerfile
    ports:
      - "5040:5040"
    environment:
      PORT: "5040"
      MARKETPLACE_APP_ID: "marketplace.demo.test"
      MARKETPLACE_BASE_URL: "http://localhost:5040"
      MARKETPLACE_RESOLVER_URL: "http://resolver:8080"
      WORLD_DATABASE_CONNECTION_STRING: "postgresql://marketplace_app:ohpp_marketplace_demo_password@postgres:5432/ohpp"
      WORLD_DATABASE_RUN_BOOTSTRAP: "true"
      AUTH_KEYCLOAK_AUTHORITY: "http://keycloak:8080/realms/ohpp-marketplace"
      AUTH_KEYCLOAK_AUDIENCE: "ohpp-marketplace-app"
      AUTH_PUBLIC_AUTHORITY: "http://localhost:8080/realms/ohpp-marketplace"
    depends_on:
      resolver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5040/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ohpp

  # --- CLI (interactive) ---
  cli:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: demo/client-cli/Dockerfile
    stdin_open: true
    tty: true
    volumes:
      - cli_config:/root/.ohpp
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      - ohpp

volumes:
  postgres_data:
  cli_config:

networks:
  ohpp:
    driver: bridge
