services:
  # --- Backing services ---
  # Third-party/backing tier. Bring up with `make dev-backing-up` (or the
  # "backing" profile). Rarely rebuilt; persists across app restarts.
  postgres:
    profiles: ["backing"]
    image: postgres:16-alpine
    # TLS (U7.1): the entrypoint wrapper installs the postgres leaf cert/key with
    # postgres-owned 0600 perms (the shared volume publishes 0644) and enables ssl.
    entrypoint: ["/usr/local/bin/ssl-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ohpp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ohpp_dev_password}
      POSTGRES_DB: ohpp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform/world-database/init:/docker-entrypoint-initdb.d:ro
      - ./platform/world-database/ssl-entrypoint.sh:/usr/local/bin/ssl-entrypoint.sh:ro
      - ca_certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohpp"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      cert-init:
        condition: service_completed_successfully
    networks:
      - ohpp

  keycloak:
    profiles: ["backing"]
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      # TLS (U7.1): serve HTTPS on 8443 with the keycloak leaf cert (chain) in
      # addition to HTTP on 8080. Server-to-server token/JWKS calls use HTTPS;
      # the browser login flow keeps using http://localhost:8080 during the
      # migration so the host/Playwright need not trust the dev root.
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak.chain.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak.key
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./platform/resolver/keycloak:/opt/keycloak/data/import:ro
      - ca_certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      cert-init:
        condition: service_completed_successfully
    networks:
      - ohpp

  # Shared World Redis (U7.1) - cache/queue, consumed by GlitchTip and PostHog
  # via isolated logical DB indices, and available to any future service.
  # TLS (U7.1, Phase 6): TLS-only on 6379 (plaintext port disabled). Presents the
  # redis leaf chain; client-cert auth is off (--tls-auth-clients no) since clients
  # authenticate by password/URL, not mTLS. The healthcheck uses redis-cli --tls.
  redis:
    profiles: ["backing"]
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--port"
      - "0"
      - "--tls-port"
      - "6379"
      - "--tls-cert-file"
      - "/certs/redis.chain.crt"
      - "--tls-key-file"
      - "/certs/redis.key"
      - "--tls-ca-cert-file"
      - "/certs/root_ca.crt"
      - "--tls-auth-clients"
      - "no"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ca_certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cert /certs/redis.crt --key /certs/redis.key --cacert /certs/root_ca.crt ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      cert-init:
        condition: service_completed_successfully
    networks:
      - ohpp

  # --- Observability backbone (U7.1, default profile) ---
  otel-collector:
    profiles: ["backing"]
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./platform/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
      # TLS (U7.1): the gRPC receiver terminates TLS with the collector leaf cert.
      - ca_certs:/certs:ro
    ports:
      - "4317:4317"   # OTLP gRPC (TLS)
      - "4318:4318"   # OTLP HTTP (plaintext; browser SPA path)
    depends_on:
      cert-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - ohpp

  loki:
    profiles: ["backing"]
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./platform/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      # Query API on the host so the observability verification suite (and manual
      # LogQL queries) can reach it. Grafana still queries it internally.
      - "3110:3100"
    networks:
      - ohpp

  tempo:
    profiles: ["backing"]
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./platform/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      # Query API on the host for the observability verification suite.
      - "3200:3200"
    networks:
      - ohpp

  prometheus:
    profiles: ["backing"]
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./platform/observability/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ohpp

  grafana:
    profiles: ["backing"]
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./platform/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ohpp

  # One-shot: run GlitchTip DB migrations, then seed a fixed dev org/project/DSN
  # so crash reporting works out of the box (no manual clicking; survives clean).
  # The v4.0 web image does not auto-migrate, so this must run before web/worker.
  glitchtip-init:
    profiles: ["backing"]
    image: glitchtip/glitchtip:v4.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "./manage.py migrate --noinput && ./manage.py shell < /seed/seed.py"
    volumes:
      - ./platform/observability/glitchtip/seed.py:/seed/seed.py:ro
    environment: &glitchtip-env
      # GlitchTip (third-party dev-only observability image) connects over TLS but
      # uses sslmode=require rather than verify-full: wiring the dev root CA into
      # this image's psycopg trust store is out of scope, and the collector/DB are
      # not exposed outside localhost. Documented dev exception (see
      # infrastructure-design/deployment-architecture.md). Our own services use verify-full.
      DATABASE_URL: "postgresql://glitchtip_app:${GLITCHTIP_DB_PASSWORD:-ohpp_glitchtip_dev_password}@postgres:5432/glitchtip?sslmode=require"
      # Redis over TLS (rediss://). ssl_cert_reqs=none: encryption without CA
      # verification, matching the DB sslmode=require dev exception for this
      # third-party image (see deployment-architecture.md).
      REDIS_URL: "rediss://redis:6379/1?ssl_cert_reqs=none"
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-ohpp-glitchtip-dev-secret-key-change-me}
      GLITCHTIP_DOMAIN: "http://localhost:8000"
      EMAIL_URL: "consolemail://"
      DEFAULT_FROM_EMAIL: "glitchtip@ohpp.dev"
      GLITCHTIP_ENABLE_UPTIME: "false"
      ENABLE_ORGANIZATION_CREATION: "true"
      OHPP_GLITCHTIP_PUBLIC_KEY: ${OHPP_GLITCHTIP_PUBLIC_KEY:-0bbc1e00-c11e-4000-8000-000000000001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ohpp

  # Local certificate authority (U7.1, Phase 6). One-shot: creates a persisted
  # root+intermediate CA and issues per-service leaf certs (SAN = service name +
  # localhost) into the shared ca_certs volume, so every hop can use TLS with a
  # trusted dev root. Idempotent; re-runs are no-ops. Dev-only.
  cert-init:
    profiles: ["backing"]
    image: smallstep/step-ca:0.27.4
    user: root
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/issue-certs.sh"]
    environment:
      STEPCA_PASSWORD: ${STEPCA_PASSWORD:-ohpp-dev-ca-password}
      CA_DIR: /home/step/ca
      OUT_DIR: /certs
    volumes:
      - ./platform/ca/issue-certs.sh:/usr/local/bin/issue-certs.sh:ro
      - stepca_data:/home/step/ca
      - ca_certs:/certs
    networks:
      - ohpp

  # Crash / error reporting (U7.1). Sentry-API-compatible; the Flutter app sends
  # crashes here via the Sentry SDK (Phase 5). Runs as web + worker (the canonical
  # split) so events are actually processed into issues. Reuses World Postgres
  # (own `glitchtip` db) + World Redis (own DB index 1). Dev-only credentials.
  glitchtip:
    profiles: ["backing"]
    image: glitchtip/glitchtip:v4.0
    environment: &glitchtip-web-env
      # See glitchtip-init: dev-only sslmode=require / rediss ssl_cert_reqs=none exception.
      DATABASE_URL: "postgresql://glitchtip_app:${GLITCHTIP_DB_PASSWORD:-ohpp_glitchtip_dev_password}@postgres:5432/glitchtip?sslmode=require"
      REDIS_URL: "rediss://redis:6379/1?ssl_cert_reqs=none"
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-ohpp-glitchtip-dev-secret-key-change-me}
      GLITCHTIP_DOMAIN: "http://localhost:8000"
      EMAIL_URL: "consolemail://"
      DEFAULT_FROM_EMAIL: "glitchtip@ohpp.dev"
      GLITCHTIP_ENABLE_UPTIME: "false"
      ENABLE_ORGANIZATION_CREATION: "true"
      CELERY_WORKER_AUTOSCALE: "1,2"
      # Migrations are handled by glitchtip-init; don't race them here.
      SKIP_INIT: "true"
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip-init:
        condition: service_completed_successfully
    healthcheck:
      # The image ships Python but not wget/curl; probe via urllib.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/_health/').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ohpp

  # GlitchTip background worker (processes ingested events into issues).
  glitchtip-worker:
    profiles: ["backing"]
    image: glitchtip/glitchtip:v4.0
    # Plain worker (no beat). Event processing into issues is what we need for
    # dev crash reporting; periodic beat tasks (retention, uptime scheduling)
    # are unnecessary here and beat errors on the disabled uptime tables.
    command: ["./bin/run-celery.sh"]
    environment: *glitchtip-web-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip-init:
        condition: service_completed_successfully
      glitchtip:
        condition: service_started
    networks:
      - ohpp

  # --- Platform ---
  # Application tier (our code). Bring up with `make dev-apps-up` (or the "apps"
  # profile); rebuilt frequently. Assumes the backing tier is already running.
  resolver:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: platform/resolver/Dockerfile
    ports:
      - "5050:8080"    # HTTP (kept as fallback during the HTTPS migration)
      - "5443:8443"    # HTTPS (TLS with the step-ca leaf cert)
    volumes:
      - ca_certs:/certs:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__PostgreSQL: "Host=postgres;Database=ohpp;Username=ohpp;Password=${POSTGRES_PASSWORD:-ohpp_dev_password};SSL Mode=VerifyFull;Root Certificate=/certs/root_ca.crt"
      Resolver__BaseUrl: "http://localhost:5050"
      Resolver__InternalBaseUrl: "http://resolver:8080"
      Resolver__Name: "OHPP Demo Resolver"
      Resolver__EncryptionKey: ${RESOLVER_ENCRYPTION_KEY:-dev-encryption-key-min-32-chars!!}
      Auth__Provider: "Keycloak"
      # Internal JWKS/metadata fetch over HTTPS (U7.1). Browser-issued tokens carry
      # the localhost issuer; the validator accepts both (see KeycloakIdentityTokenValidator).
      Auth__Keycloak__Authority: "https://keycloak:8443/realms/ohpp"
      Features__ProtocolLab: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "ohpp.resolver"
      # TLS (U7.1): serve HTTPS on 8443 with the resolver leaf cert (chain) in
      # addition to HTTP on 8080. Trust the dev root for outbound TLS calls.
      OHPP_TLS_CERT_PATH: /certs/resolver.chain.crt
      OHPP_TLS_KEY_PATH: /certs/resolver.key
      OHPP_TLS_PORT: "8443"
      SSL_CERT_FILE: /certs/root_ca.crt
    depends_on:
      cert-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ohpp

  portal:
    profiles: ["apps"]
    build:
      context: platform/portal
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_PROTOCOL_LAB: "true"
        # Browser exports OTLP/HTTP to the Collector's host-published port.
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
        VITE_OTEL_SERVICE_NAME: "ohpp.portal"
    ports:
      - "3000:80"
    volumes:
      - ca_certs:/certs:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
      resolver:
        condition: service_healthy
    networks:
      - ohpp

  # --- Landing page: the single front door to the whole demo ---
  # Self-contained static site (no backend/DB/auth). It only links out to the
  # other services, so it has no depends_on and starts instantly. This is the one
  # URL `make dev` prints; it maps everything else, grouped by purpose.
  landing:
    profiles: ["apps"]
    build:
      context: platform/landing
      dockerfile: Dockerfile
    ports:
      - "8888:80"
    healthcheck:
      # Use 127.0.0.1 (not localhost): nginx listens on IPv4, but localhost can
      # resolve to IPv6 ::1 first inside the container, giving a false refusal.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ohpp

  # --- Demo apps ---
  bank:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: demo/mock-apps/dotnet/bank/Dockerfile
    ports:
      - "5010:5010"
    volumes:
      - ca_certs:/certs:ro
    environment:
      Bank__AppId: "bank.demo.test"
      Bank__BaseUrl: "http://localhost:5010"
      Bank__ResolverInternalUrl: "https://resolver:8443"
      WorldDatabase__ConnectionString: "Host=postgres;Port=5432;Database=ohpp;Username=bank_app;Password=ohpp_bank_demo_password;SSL Mode=VerifyFull;Root Certificate=/certs/root_ca.crt"
      WorldDatabase__RunBootstrap: "true"
      Auth__Keycloak__Authority: "https://keycloak:8443/realms/ohpp-bank"
      Auth__Keycloak__Audience: "ohpp-bank-app"
      Auth__PublicAuthority: "http://localhost:8080/realms/ohpp-bank"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "ohpp.bank"
      # Trust the dev CA root for the outbound TLS call to the resolver.
      SSL_CERT_FILE: /certs/root_ca.crt
    depends_on:
      cert-init:
        condition: service_completed_successfully
      resolver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - ohpp

  insurance-claims:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: demo/mock-apps/dotnet/insurance-claims/Dockerfile
    ports:
      - "5020:5020"
    volumes:
      - ca_certs:/certs:ro
    environment:
      Insurance__AppId: "insurance-claims.demo.test"
      Insurance__BaseUrl: "http://localhost:5020"
      Insurance__ResolverUrl: "https://resolver:8443"
      WorldDatabase__ConnectionString: "Host=postgres;Port=5432;Database=ohpp;Username=insurance_claims_app;Password=ohpp_insurance_demo_password;SSL Mode=VerifyFull;Root Certificate=/certs/root_ca.crt"
      WorldDatabase__RunBootstrap: "true"
      Auth__Keycloak__Authority: "https://keycloak:8443/realms/ohpp-insurance"
      Auth__Keycloak__Audience: "ohpp-insurance-app"
      Auth__PublicAuthority: "http://localhost:8080/realms/ohpp-insurance"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "ohpp.insurance"
      SSL_CERT_FILE: /certs/root_ca.crt
    depends_on:
      cert-init:
        condition: service_completed_successfully
      resolver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - ohpp

  pizza:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: demo/mock-apps/node/pizza/Dockerfile
    ports:
      - "5030:5030"
    volumes:
      - ca_certs:/certs:ro
    environment:
      PORT: "5030"
      PIZZA_APP_ID: "pizza.demo.test"
      PIZZA_BASE_URL: "http://localhost:5030"
      PIZZA_RESOLVER_URL: "https://resolver:8443"
      WORLD_DATABASE_CONNECTION_STRING: "postgresql://pizza_app:ohpp_pizza_demo_password@postgres:5432/ohpp?sslmode=verify-full"
      WORLD_DATABASE_RUN_BOOTSTRAP: "true"
      AUTH_KEYCLOAK_AUTHORITY: "https://keycloak:8443/realms/ohpp-pizza"
      AUTH_KEYCLOAK_AUDIENCE: "ohpp-pizza-app"
      AUTH_PUBLIC_AUTHORITY: "http://localhost:8080/realms/ohpp-pizza"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_SERVICE_NAME: "ohpp.pizza"
      # Trust the dev CA root for the outbound TLS call to the resolver (Node).
      NODE_EXTRA_CA_CERTS: /certs/root_ca.crt
    depends_on:
      cert-init:
        condition: service_completed_successfully
      resolver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5030/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ohpp

  marketplace:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: demo/mock-apps/node/marketplace/Dockerfile
    ports:
      - "5040:5040"
    volumes:
      - ca_certs:/certs:ro
    environment:
      PORT: "5040"
      MARKETPLACE_APP_ID: "marketplace.demo.test"
      MARKETPLACE_BASE_URL: "http://localhost:5040"
      MARKETPLACE_RESOLVER_URL: "https://resolver:8443"
      WORLD_DATABASE_CONNECTION_STRING: "postgresql://marketplace_app:ohpp_marketplace_demo_password@postgres:5432/ohpp?sslmode=verify-full"
      WORLD_DATABASE_RUN_BOOTSTRAP: "true"
      AUTH_KEYCLOAK_AUTHORITY: "https://keycloak:8443/realms/ohpp-marketplace"
      AUTH_KEYCLOAK_AUDIENCE: "ohpp-marketplace-app"
      AUTH_PUBLIC_AUTHORITY: "http://localhost:8080/realms/ohpp-marketplace"
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_SERVICE_NAME: "ohpp.marketplace"
      NODE_EXTRA_CA_CERTS: /certs/root_ca.crt
    depends_on:
      cert-init:
        condition: service_completed_successfully
      resolver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5040/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ohpp

  # --- CLI (interactive) ---
  cli:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: demo/client-cli/Dockerfile
    stdin_open: true
    tty: true
    volumes:
      - cli_config:/root/.ohpp
      - ca_certs:/certs:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "ohpp.cli"
      # Trust the dev CA root for the outbound TLS OTLP export (.NET/OpenSSL).
      SSL_CERT_FILE: /certs/root_ca.crt
    depends_on:
      cert-init:
        condition: service_completed_successfully
      resolver:
        condition: service_healthy
    networks:
      - ohpp

  # --- Analytics (opt-in `analytics` profile: `make dev-analytics`) ---
  # Product analytics via Umami (events, funnels, retention, journeys). Umami
  # replaced PostHog: current PostHog self-host needs Kafka + ~16GB RAM and can't
  # cleanly reuse shared datastores, which breaks this unit's lean one-command
  # goal. Umami is Postgres-ONLY (no ClickHouse/Redis/Kafka) and reuses the shared
  # World Postgres via its own `umami` db. See deployment-architecture.md.
  #
  # One-shot: Umami auto-migrates on boot, so this seeds a fixed dev website
  # (deterministic UUID) via the authenticated API once Umami is healthy, so the
  # analytics "key" is a known stable value with no manual clicking (survives clean).
  umami-init:
    profiles: ["analytics"]
    # Uses psql (not curl): Umami v2.14 ignores a custom website id via its API,
    # so we pin the deterministic tracking-key UUID by seeding the website row
    # directly in the umami db once Umami has auto-migrated its schema.
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/seed/seed-umami.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: umami
      PGUSER: ohpp
      PGPASSWORD: ${POSTGRES_PASSWORD:-ohpp_dev_password}
      UMAMI_ADMIN_USER: "admin"
      # Fixed website UUID so the analytics key is deterministic across clean runs.
      OHPP_UMAMI_WEBSITE_ID: ${OHPP_UMAMI_WEBSITE_ID:-0a119000-0b11-4000-8000-000000000002}
      OHPP_UMAMI_WEBSITE_NAME: "OHPP"
      OHPP_UMAMI_WEBSITE_DOMAIN: "ohpp.local"
    volumes:
      - ./platform/observability/umami/seed-umami.sh:/seed/seed-umami.sh:ro
    depends_on:
      umami:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ohpp

  umami:
    profiles: ["analytics"]
    image: ghcr.io/umami-software/umami:postgresql-v2.14.0
    environment:
      # Third-party dev-only image: connects to World Postgres over TLS with
      # sslmode=require (encryption without CA verification), the same documented
      # dev exception used by GlitchTip. Our own services use verify-full.
      DATABASE_URL: "postgresql://umami_app:${UMAMI_DB_PASSWORD:-ohpp_umami_dev_password}@postgres:5432/umami?sslmode=require"
      DATABASE_TYPE: "postgresql"
      APP_SECRET: ${UMAMI_APP_SECRET:-ohpp-umami-dev-secret-change-me}
      # Pin the seeded website UUID so its tracking key is deterministic.
      TRACKER_SCRIPT_NAME: "script.js"
    ports:
      - "8001:3000"
    healthcheck:
      # Use 127.0.0.1 (not localhost): Next.js binds IPv4 0.0.0.0, and localhost
      # can resolve to IPv6 ::1 first inside the container, giving a false refusal.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ohpp

  # --- Placeholder stubs (opt-in `analytics` profile) ---
  # These are interface placeholders for future vendor seams (object store, email,
  # secrets). They are NOT consumed by any app logic yet - they exist so the dev
  # stack can stand in for the production dependencies when those seams are built.
  minio:
    profiles: ["analytics"]
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ohpp_minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ohpp_minio_dev_password}
    ports:
      - "9002:9000"   # S3 API (9000 is taken by step-ca internally / ClickHouse convention)
      - "9001:9001"   # console
    volumes:
      - minio_data:/data
    networks:
      - ohpp

  mailpit:
    profiles: ["analytics"]
    image: axllent/mailpit:v1.20.5
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    networks:
      - ohpp

  openbao:
    profiles: ["analytics"]
    image: openbao/openbao:2.0.0
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:-ohpp-openbao-dev-root}
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - ohpp

volumes:
  postgres_data:
  cli_config:
  redis_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  glitchtip_media:
  minio_data:
  stepca_data:
  ca_certs:

networks:
  ohpp:
    driver: bridge
