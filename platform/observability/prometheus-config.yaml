# Prometheus configuration for the OHPP dev stack (U7.1).
# Receives metrics via remote-write from the OTel Collector. Also scrapes its
# own metrics. Service metrics arrive through the Collector (push), so scrape
# targets here are minimal.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
