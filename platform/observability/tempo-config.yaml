# Tempo configuration for the OHPP dev stack (U7.1).
# Filesystem storage (dev). Receives traces from the OTel Collector over OTLP.

server:
  http_listen_port: 3200
  grpc_listen_port: 9097

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h  # 7d, dev

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Enable trace-to-metrics/label pivots by request_id via attributes.
overrides:
  defaults:
    metrics_generator:
      processors: []
