# Loki configuration for the OHPP dev stack (U7.1).
# Filesystem storage (dev) - no object store container per the consolidation
# review (Option A). Single-binary mode.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Accept OTLP resource attributes as labels for service filtering.
  allow_structured_metadata: true
  retention_period: 168h  # 7d, dev

ruler:
  alertmanager_url: http://localhost:9093
