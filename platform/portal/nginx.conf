server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Resolver
    location /api/ {
        proxy_pass http://resolver:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Proxy health check to Resolver (for connectivity verification)
    location /api/health {
        proxy_pass http://resolver:8080/health;
        proxy_set_header Host $host;
    }

    # Proxy Swagger
    location /swagger/ {
        proxy_pass http://resolver:8080/swagger/;
        proxy_set_header Host $host;
    }

    # Proxy Keycloak auth
    location /auth/ {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
