server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Resolver over TLS (U7.1, Phase 6). Verifies the
    # resolver's cert against the mounted step-ca root; the SAN "resolver" must
    # match proxy_ssl_name.
    location /api/ {
        proxy_pass https://resolver:8443/api/;
        proxy_ssl_trusted_certificate /certs/root_ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name resolver;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Proxy health check to Resolver (for connectivity verification)
    location /api/health {
        proxy_pass https://resolver:8443/health;
        proxy_ssl_trusted_certificate /certs/root_ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name resolver;
        proxy_set_header Host $host;
    }

    # Proxy Swagger
    location /swagger/ {
        proxy_pass https://resolver:8443/swagger/;
        proxy_ssl_trusted_certificate /certs/root_ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name resolver;
        proxy_set_header Host $host;
    }

    # Proxy Keycloak auth over TLS (U7.1, Phase 6). Verifies the keycloak cert
    # against the step-ca root; SAN "keycloak" must match proxy_ssl_name. The token
    # issuer stays http://localhost:8080 because KC_HOSTNAME_URL forces the frontend
    # URL regardless of this backchannel scheme.
    location /auth/ {
        proxy_pass https://keycloak:8443/;
        proxy_ssl_trusted_certificate /certs/root_ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
