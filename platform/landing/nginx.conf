server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static landing page only; everything is served from this root.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight health endpoint for the compose healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
