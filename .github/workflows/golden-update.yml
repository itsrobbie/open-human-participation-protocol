name: Update Goldens

# Regenerates the Flutter golden baselines INSIDE the shared one-OS image and
# commits them, so the committed PNGs always match what the image renders. Run
# this once after the dev image is first published (the current baselines were
# generated on macOS and will not match Linux), and again any time a widget's
# appearance legitimately changes.
#
# Manual only: regenerating goldens is a deliberate act that must be reviewed in
# the diff, never an automatic side effect of a normal push.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to regenerate goldens on and commit to'
        required: true
        default: 'dev/thread-a'

concurrency:
  group: update-goldens-${{ github.event.inputs.branch }}
  cancel-in-progress: true

jobs:
  image:
    name: Resolve dev image
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          HASH=$(find .devcontainer -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${REPO}/dev-image:${HASH}" >> "$GITHUB_OUTPUT"

  regenerate:
    name: Regenerate and commit goldens
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Regenerate goldens
        working-directory: platform/client-app
        run: |
          flutter pub get
          flutter test --update-goldens

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain '*/goldens/*.png')" ]; then
            git add '*/goldens/*.png'
            git commit -m "test(client-app): regenerate golden baselines in the shared Linux image"
            git push origin "HEAD:${{ github.event.inputs.branch }}"
            echo "Committed regenerated goldens."
          else
            echo "No golden changes — baselines already match the image."
          fi
