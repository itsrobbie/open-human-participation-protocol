name: Dev Image

# Builds the ONE Linux dev image (.devcontainer/Dockerfile) and publishes it to
# GHCR so every other workflow can run INSIDE it. This is what makes CI and a
# local devcontainer the same environment: identical dotnet/node/flutter/python
# and, crucially, identical fonts so golden tests render byte-for-byte the same.
#
# Tag strategy: `latest` on main, plus a content hash of the devcontainer files
# so a change to the image definition produces a new tag that dependent
# workflows pick up automatically.

on:
  push:
    branches: [main, 'dev/**']
    paths:
      - '.devcontainer/**'
      - '.github/workflows/dev-image.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/dev-image.yml'
  workflow_dispatch:

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish dev image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag from devcontainer content
        id: tag
        run: |
          HASH=$(find .devcontainer -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO}/dev-image" >> "$GITHUB_OUTPUT"
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:latest
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
