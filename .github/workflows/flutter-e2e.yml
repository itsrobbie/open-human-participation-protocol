name: Flutter E2E Tests (Nightly)

on:
  # Manual trigger for on-demand E2E validation
  workflow_dispatch:

  # Nightly schedule (2am UTC)
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: flutter-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Device Tests (FINAL GATE)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install Flutter dependencies
        working-directory: platform/client-app
        run: flutter pub get

      # GitHub's macos-latest runner image no longer ships a container runtime,
      # so `docker` is absent and the stack can't start. Install Docker + the
      # Compose plugin and bring up a Colima VM to host the daemon. This is the
      # one place the nightly needs the runtime that local dev already has.
      - name: Set up Docker (Colima)
        run: |
          brew install docker docker-compose colima
          # Link the compose plugin so `docker compose` works (not docker-compose).
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose
          colima start --cpu 3 --memory 8 --disk 30
          docker version
          docker compose version

      # The app tier serves HTTPS with the step-ca dev root and connects to
      # Postgres with sslmode=verify-full, so the certs must exist before the
      # apps can come up healthy. `make dev` then builds + starts backing + apps
      # using the current docker-compose.backing.yml + docker-compose.apps.yml
      # (the old single docker-compose.yml this workflow used was removed in U9).
      - name: Bring up the OHPP stack
        run: |
          make ca-issue
          make dev
          echo "Waiting for the resolver to report healthy..."
          timeout 120 bash -c 'until curl -sf http://localhost:5050/health; do sleep 2; done'

      - name: Create and boot an iOS simulator
        run: |
          xcrun simctl create "E2E iPhone" "iPhone 16 Pro" 2>/dev/null || true
          xcrun simctl boot "E2E iPhone" 2>/dev/null || true
          xcrun simctl bootstatus "E2E iPhone" -b || true

      # Drive the same target developers run locally. flutter-test-e2e resolves
      # the named simulator, checks the stack health, and runs the integration
      # suite with the correct dart-defines (OHPP_ANTI_AGENT_MODE=test etc).
      - name: Run Flutter E2E (integration suite on the simulator)
        env:
          FLUTTER_E2E_DEVICE: 'E2E iPhone'
        run: make flutter-test-e2e

      - name: Tear down the stack
        if: always()
        run: make dev-down || true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            platform/client-app/build/
          retention-days: 7
