name: Flutter E2E Tests (Nightly)

on:
  # Manual trigger for on-demand E2E validation
  workflow_dispatch:

  # Nightly schedule (2am UTC)
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: flutter-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Device Tests (FINAL GATE)
    runs-on: macos-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: platform/client-app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Start backend stack
        working-directory: .
        run: |
          docker compose up --build -d --wait
          echo "Waiting for services to be healthy..."
          timeout 60 bash -c 'until curl -sf http://localhost:5050/health; do sleep 2; done'

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | .value[] | select(.name | contains("iPhone")) | .udid' | head -1)
          if [ -z "$DEVICE_ID" ]; then
            xcrun simctl create "E2E iPhone" "iPhone 16 Pro" "iOS-18-2"
            DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | .value[] | select(.name == "E2E iPhone") | .udid')
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          echo "SIMULATOR_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Run E2E tests
        run: flutter test integration_test/ -d "$SIMULATOR_ID"

      - name: Teardown backend
        if: always()
        working-directory: .
        run: docker compose down --volumes

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            platform/client-app/build/
          retention-days: 7
